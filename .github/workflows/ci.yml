name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow only ever reads the repository: it never needs write
# access, and it never needs a secret of any kind.
permissions:
  contents: read

# One run per ref. A superseded pull-request run is cancelled so a stale push does not
# keep burning minutes. A push to main is never cancelled, so the record of what main
# actually built is kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android unit tests and debug assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The local build runs on Android Studio's JBR, which is OpenJDK 25. Pinning the
          # same major version here keeps CI on the toolchain the project is actually
          # developed against, rather than a different JDK nobody has tested it with.
          # `compileOptions` targets Java 11 bytecode, well below this.
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Make the Gradle wrapper executable
        # gradlew is tracked with mode 100644, so after a fresh checkout it is not
        # executable and `./gradlew` would fail with "Permission denied".
        run: chmod +x gradlew

      # The runner image ships the Android SDK with ANDROID_HOME and ANDROID_SDK_ROOT
      # already set, so no setup action is needed. This step exists to make a future
      # failure readable from the step output alone: GitHub's logs API is not readable
      # without authentication, so "what did the runner actually have?" has to be
      # answered here, in the log, rather than in a follow-up guess.
      #
      # Every probe here is non-fatal on purpose. This step reports; it does not gate.
      - name: Report the Android SDK and toolchain
        id: sdk
        run: |
          set -u
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "--- java -version ---"
          java -version 2>&1 || true
          echo "--- candidate SDK directories ---"
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" "$HOME/Library/Android/sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "EXISTS  $d"
              ls -1 "$d" 2>/dev/null || true
            else
              echo "MISSING $d"
            fi
          done
          echo "--- locating sdkmanager ---"
          SDKMANAGER=""
          for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/*/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/*/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/tools/bin/sdkmanager" ; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDKMANAGER=${SDKMANAGER:-<not found>}"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "--- installed platforms and build-tools ---"
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d/platforms" ]; then
              echo "platforms in $d:"
              ls -1 "$d/platforms" 2>/dev/null || true
              echo "build-tools in $d:"
              ls -1 "$d/build-tools" 2>/dev/null || true
              echo "platform-tools in $d:"
              ls -1 "$d/platform-tools" 2>/dev/null | head -5 || true
              break
            fi
          done
          echo "--- sdkmanager --list_installed ---"
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --list_installed 2>&1 | head -40 || true
          fi
          echo "--- note ---"
          echo "compileSdk is release(36) { minorApiLevel = 1 }, which resolves to the"
          echo "platforms;android-36.1 platform. If it is not listed above, the Android"
          echo "Gradle plugin downloads it during the build, which needs accepted licenses."
          exit 0

      - name: Accept the Android SDK licenses
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.SDKMANAGER }}
        run: |
          set -u
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager was not found, so the licenses cannot be accepted here."
            echo "The runner image may already have accepted them; if not, the build step"
            echo "below will say so in its own output."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "licenses accepted via $SDKMANAGER"
          exit 0

      - name: Try to install the Android SDK packages the build needs
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.SDKMANAGER }}
        run: |
          set -u
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found - skipping the optional install."
            exit 0
          fi
          # The exact package id for a minor-version platform is not something to guess at,
          # so this is deliberately tolerant and the build must not depend on it. These
          # attempts only help when a guess happens to be right; otherwise the Android
          # Gradle plugin resolves and downloads precisely what it needs.
          "$SDKMANAGER" --install "platform-tools" > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;36.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36.1" > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" > /dev/null 2>&1 || true
          echo "optional SDK install attempts finished (all tolerated)"
          exit 0

      - name: Assert the build does not depend on app/google-services.json
        # The config file is gitignored, so CI has no copy and never will. If it ever
        # appears here, the build is no longer the build this workflow is meant to prove.
        run: |
          set -euo pipefail
          if [ -e app/google-services.json ]; then
            echo "::error::app/google-services.json must not exist in CI. The build has to work without it."
            exit 1
          fi
          echo "app/google-services.json is absent, as intended."

      - name: Run the unit tests and the debug assemble
        env:
          # The build redirects its output directory outside the repository. Pinning it
          # here is what makes the report paths below knowable in advance.
          HZB_BUILD_DIR: ${{ runner.temp }}/hanzisrs-build
        # --no-daemon is deliberate: a single-use daemon avoids the daemon startup and
        # registry path that stalled a local run for forty minutes, and CI is
        # single-use anyway. --max-workers=2 keeps the forked test workers within the
        # runner's memory, which the 4g heap in gradle.properties expects.
        # --stacktrace puts the cause of a failure in the step output, because GitHub's
        # logs API cannot be read without authentication.
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Assert the debug APK was produced without the config file
        env:
          HZB_BUILD_DIR: ${{ runner.temp }}/hanzisrs-build
        run: |
          set -euo pipefail
          test -f "$HZB_BUILD_DIR/app/outputs/apk/debug/app-debug.apk"
          if [ -d "$HZB_BUILD_DIR/app/generated/res/processDebugGoogleServices" ]; then
            echo "::error::the google-services plugin ran, so the build is not independent of the config file."
            exit 1
          fi
          echo "The debug APK was built without app/google-services.json, and the plugin never ran."

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            ${{ runner.temp }}/hanzisrs-build/app/test-results/testDebugUnitTest/
            ${{ runner.temp }}/hanzisrs-build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend proxy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json requires node >=20; this pins the version the backend is
          # actually developed and tested against locally.
          node-version: '24'

      - name: Assert no credential is present
        # The backend tests supply their own TEST_KEY fixture and stub the HTTP layer,
        # so nothing here may need a real Gemini key.
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY must not be set in CI. The backend tests use their own fixture."
            exit 1
          fi
          echo "No GEMINI_API_KEY in the environment."

      - name: Run the backend tests
        run: npm test
